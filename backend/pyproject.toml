[project]
name = "jarvis-backend"
version = "0.1.0"
description = "JARVIS reasoning/vision/memory backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.120",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 130
# Linting is intentionally pinned to the lowest Python this repo is actually
# verified against (3.9, available in sandboxed/CI environments without
# 3.12) so ruff doesn't suggest 3.10+-only syntax (e.g. `X | None`) that
# would break on that interpreter. The real deployment target is still
# Python 3.12+ (see `requires-python` above).
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)`/etc. as default-argument values is
# the framework's documented, correct usage pattern, not the mutable-default
# footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
